[package]
name = "atlas-engine"
version = "0.1.0"
edition = "2021"
description = "An offline SQLite notebook engine with revision-safe writes and verifiable portable backups"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
pulldown-cmark = "0.13"
fs2 = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"
